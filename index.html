<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="app-version" content="1.6.0">
  <title>Gem Royale</title>
  <meta name="theme-color" content="#1a0626">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gem Royale">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css?v=1.6.0">
</head>
<body>
  <div id="loading"><div class="spinner"></div><p>Polishing gems…</p></div>

  <!-- Start screen: animated casino background + animated title, "tap to start" -->
  <section id="startScreen" hidden aria-label="Slots Gallery. Tap to start.">
    <div class="st-bg" aria-hidden="true">
      <img class="sb sb0" src="assets/start/bg-0.webp?v=1.6.0" alt="" draggable="false">
      <img class="sb sb1" src="assets/start/bg-1.webp?v=1.6.0" alt="" draggable="false">
      <img class="sb sb2" src="assets/start/bg-2.webp?v=1.6.0" alt="" draggable="false">
      <img class="sb sb3" src="assets/start/bg-3.webp?v=1.6.0" alt="" draggable="false">
    </div>
    <div class="st-shade" aria-hidden="true"></div>
    <div class="st-title" role="img" aria-label="Slots Gallery">
      <img class="stt stt0" src="assets/start/title-0.webp?v=1.6.0" alt="" draggable="false">
      <img class="stt stt1" src="assets/start/title-1.webp?v=1.6.0" alt="" draggable="false">
      <img class="stt stt2" src="assets/start/title-2.webp?v=1.6.0" alt="" draggable="false">
      <img class="stt stt3" src="assets/start/title-3.webp?v=1.6.0" alt="" draggable="false">
    </div>
    <p class="st-tap" id="startTap">TAP TO START</p>
    <p class="st-ver" id="startVer"></p>
  </section>

  <main id="app" hidden>
    <div id="stage">
      <div id="machine">
        <div id="reelWindow">
          <div class="reel"><div class="strip"></div></div>
          <div class="reel"><div class="strip"></div></div>
          <div class="reel"><div class="strip"></div></div>
          <div class="reel"><div class="strip"></div></div>
          <div class="reel"><div class="strip"></div></div>
          <svg id="lineLayer" viewBox="0 0 500 300" preserveAspectRatio="none"></svg>
          <div id="fsBar" hidden>FREE SPINS <span id="fsCount">0</span></div>
          <div id="autoChip" hidden>AUTO</div>
          <div id="winLabel" hidden></div>
          <div id="bigWin" hidden><div class="bw-title"></div><div class="bw-amount"></div></div>
        </div>
        <!-- Machine artwork: 4 animation frames, layered and cross-faded in a cycle -->
        <div id="machineArt" aria-hidden="true">
          <img class="mf mf0" src="assets/machine-0.webp?v=1.6.0" alt="" draggable="false">
          <img class="mf mf1" src="assets/machine-1.webp?v=1.6.0" alt="" draggable="false">
          <img class="mf mf2" src="assets/machine-2.webp?v=1.6.0" alt="" draggable="false">
          <img class="mf mf3" src="assets/machine-3.webp?v=1.6.0" alt="" draggable="false">
        </div>

        <!-- Displays printed on the machine -->
        <div class="disp" id="dispBet"   style="left:16.72%;top:62.99%;width:20.35%;height:4.88%"><span id="bet">0</span></div>
        <div class="disp" id="dispBal"   style="left:39.78%;top:62.99%;width:22.30%;height:4.88%"><span id="credits">0</span></div>
        <div class="disp win" id="dispWin" style="left:64.86%;top:62.99%;width:20.27%;height:4.88%"><span id="win">0</span></div>

        <!-- Sprite buttons placed over the machine's printed buttons -->
        <button class="mbtn" id="btnSettings" data-sprite="settings" style="left:13.77%;top:73.34%;width:5.91%;height:6.84%" aria-label="Settings"></button>
        <button class="mbtn" id="btnInfo" data-sprite="info" style="left:22.13%;top:73.34%;width:5.91%;height:6.84%" aria-label="Paytable and help"></button>
        <button class="mbtn" id="btnSound" data-sprite="sound" style="left:30.41%;top:73.93%;width:8.19%;height:5.66%" aria-label="Sound"></button>
        <button class="mbtn" id="btnSpin" data-sprite="spin" style="left:41.05%;top:70.12%;width:19.59%;height:14.45%" aria-label="Spin (hold for autoplay)"></button>
        <button class="mbtn" id="btnMinus" data-sprite="minus" style="left:62.67%;top:73.93%;width:4.90%;height:5.66%" aria-label="Decrease bet"></button>
        <button class="mbtn" id="btnPlus" data-sprite="plus" style="left:75.00%;top:73.93%;width:4.90%;height:5.66%" aria-label="Increase bet"></button>
        <button class="mbtn" id="btnFull" data-sprite="full" style="left:82.52%;top:73.34%;width:5.91%;height:6.84%" aria-label="Full screen"></button>
      </div>
    </div>
    <p id="hint">Tap <b>SPIN</b> to play · Hold <b>SPIN</b> for autoplay · <b>i</b> for paytable · <span id="hintVer"></span></p>
  </main>

  <!-- Paytable / help -->
  <dialog id="helpDlg">
    <div class="dlg-head"><h2>Paytable</h2><button class="close" data-close aria-label="Close">✕</button></div>
    <div class="dlg-body" id="helpBody"></div>
  </dialog>

  <!-- Settings -->
  <dialog id="settingsDlg">
    <div class="dlg-head"><h2>Settings</h2><button class="close" data-close aria-label="Close">✕</button></div>
    <div class="dlg-body">
      <div class="verbox"><span>Version</span><b id="verLbl"></b></div>
      <p class="muted">Gem Royale is a free-play game. Credits have no cash value.</p>
      <button class="wide" id="btnRefill">Reset credits to 2,000</button>
      <button class="wide" id="btnUpdate">Check for updates</button>
    </div>
  </dialog>

  <div id="toast" hidden></div>
  <div id="updating" hidden><div class="spinner"></div><p>Updating to the latest version…</p></div>

  <script src="js/engine.js?v=1.6.0"></script>
  <script src="js/update.js?v=1.6.0"></script>
  <script src="js/app.js?v=1.6.0"></script>
</body>
</html>
