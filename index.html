<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="app-version" content="1.4.0">
  <title>Gem Royale</title>
  <meta name="theme-color" content="#1a0626">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gem Royale">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css?v=1.4.0">
</head>
<body>
  <div id="loading"><div class="spinner"></div><p>Polishing gems…</p></div>

  <main id="app" hidden>
    <div id="stage">
      <div id="machine">
        <div id="reelWindow">
          <div class="reel"><div class="strip"></div></div>
          <div class="reel"><div class="strip"></div></div>
          <div class="reel"><div class="strip"></div></div>
          <div class="reel"><div class="strip"></div></div>
          <div class="reel"><div class="strip"></div></div>
          <svg id="lineLayer" viewBox="0 0 500 300" preserveAspectRatio="none"></svg>
          <div id="fsBar" hidden>FREE SPINS <span id="fsCount">0</span></div>
          <div id="autoChip" hidden>AUTO</div>
          <div id="winLabel" hidden></div>
          <div id="bigWin" hidden><div class="bw-title"></div><div class="bw-amount"></div></div>
        </div>
        <img src="assets/machine.webp?v=1.4.0" alt="" draggable="false" id="machineImg">

        <!-- Displays printed on the machine -->
        <div class="disp" id="dispBet"   style="left:10.30%;top:66.21%;width:24.32%;height:6.25%"><span id="bet">0</span></div>
        <div class="disp" id="dispBal"   style="left:36.49%;top:66.21%;width:27.03%;height:6.25%"><span id="credits">0</span></div>
        <div class="disp win" id="dispWin" style="left:65.54%;top:66.21%;width:24.16%;height:6.25%"><span id="win">0</span></div>

        <!-- Sprite buttons placed over the machine's printed buttons -->
        <button class="mbtn" id="btnSettings" data-sprite="settings" style="left:7.26%;top:77.56%;width:7.26%;height:8.55%" aria-label="Settings"></button>
        <button class="mbtn" id="btnInfo" data-sprite="info" style="left:16.81%;top:77.83%;width:6.93%;height:8.01%" aria-label="Paytable and help"></button>
        <button class="mbtn" id="btnSound" data-sprite="sound" style="left:26.18%;top:78.54%;width:9.97%;height:6.20%" aria-label="Sound"></button>
        <button class="mbtn" id="btnSpin" data-sprite="spin" style="left:38.18%;top:72.75%;width:22.80%;height:16.31%" aria-label="Spin (hold for autoplay)"></button>
        <button class="mbtn" id="btnMinus" data-sprite="minus" style="left:63.68%;top:78.54%;width:5.41%;height:6.21%" aria-label="Decrease bet"></button>
        <button class="mbtn" id="btnPlus" data-sprite="plus" style="left:77.62%;top:78.42%;width:5.57%;height:6.45%" aria-label="Increase bet"></button>
        <button class="mbtn" id="btnFull" data-sprite="full" style="left:85.73%;top:77.49%;width:7.09%;height:8.30%" aria-label="Full screen"></button>
      </div>
    </div>
    <p id="hint">Tap <b>SPIN</b> to play · Hold <b>SPIN</b> for autoplay · <b>i</b> for paytable · <span id="hintVer"></span></p>
  </main>

  <!-- Paytable / help -->
  <dialog id="helpDlg">
    <div class="dlg-head"><h2>Paytable</h2><button class="close" data-close aria-label="Close">✕</button></div>
    <div class="dlg-body" id="helpBody"></div>
  </dialog>

  <!-- Settings -->
  <dialog id="settingsDlg">
    <div class="dlg-head"><h2>Settings</h2><button class="close" data-close aria-label="Close">✕</button></div>
    <div class="dlg-body">
      <div class="verbox"><span>Version</span><b id="verLbl"></b></div>
      <p class="muted">Gem Royale is a free-play game. Credits have no cash value.</p>
      <button class="wide" id="btnRefill">Reset credits to 2,000</button>
      <button class="wide" id="btnUpdate">Check for updates</button>
    </div>
  </dialog>

  <div id="toast" hidden></div>
  <div id="updating" hidden><div class="spinner"></div><p>Updating to the latest version…</p></div>

  <script src="js/engine.js?v=1.4.0"></script>
  <script src="js/update.js?v=1.4.0"></script>
  <script src="js/app.js?v=1.4.0"></script>
</body>
</html>
