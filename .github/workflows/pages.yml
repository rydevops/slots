name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check version numbers are consistent
        run: |
          V=$(node -p "require('./version.json').version")
          echo "Version $V"
          grep -q "<meta name=\"app-version\" content=\"$V\">" index.html || { echo "index.html app-version meta is not $V - run: node tools/bump-version.js $V"; exit 1; }
          grep -q "const VERSION = '$V';" sw.js || { echo "sw.js VERSION is not $V - run: node tools/bump-version.js $V"; exit 1; }
          if grep -o '?v=[^"]*' index.html | grep -v "?v=$V\$"; then echo "index.html has ?v= queries that are not $V"; exit 1; fi

      - name: Build site
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js version.json css js assets icons _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
