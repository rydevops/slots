name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site and stamp version
        run: |
          BUILD="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js version.json css js assets icons _site/
          sed -i "s/__BUILD__/${BUILD}/g" _site/index.html _site/sw.js _site/version.json
          echo "Built version ${BUILD}"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
